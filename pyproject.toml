[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hail-ppo-reproduction"
version = "0.1.0"
description = "Reproduction of HRT AI Labs' reinforcement-learning optimal-execution project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
rl = ["stable-baselines3>=2.7,<3", "sb3-contrib>=2.7,<3", "matplotlib>=3.9,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/hail_ppo_reproduction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
